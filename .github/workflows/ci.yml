name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with the local toolchain (docs/DEVELOPMENT.md).
  XCODE_APP: /Applications/Xcode_27.0.app
  SWIFTLINT_VERSION: 0.65.1
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=latest

jobs:
  lint:
    name: Lint
    # Xcode 27 image (public preview): https://github.com/actions/runner-images/issues/14404
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Install SwiftLint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: swift-format
        run: |
          xcrun swift-format lint --strict --recursive \
            Peak Packages/PeakKit/Package.swift Packages/PeakKit/Sources Packages/PeakKit/Tests

  build-and-test:
    name: Build & Test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Build app
        run: |
          xcodebuild build -quiet \
            -project Peak.xcodeproj -scheme Peak \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test PeakKit
        working-directory: Packages/PeakKit
        run: |
          xcodebuild test -quiet \
            -scheme PeakKit-Package \
            -destination "$DESTINATION"
